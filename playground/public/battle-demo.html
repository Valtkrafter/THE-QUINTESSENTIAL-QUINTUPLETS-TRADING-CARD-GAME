<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How a turn works</title>
<style>
:root{--gold:#f2c75c;--text:#eef0f7;--mute:#9aa3bd;--good:#6fd6a0;--bad:#ff7f8e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f1424;color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#stageBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:1280px;height:720px;position:relative;flex:none;transform-origin:center center;background:radial-gradient(ellipse at 50% 40%,#2a3556 0%,#1a2138 55%,#131829 100%);overflow:hidden;border-radius:14px}
#dyn{position:absolute;inset:0}
.lbl{position:absolute;color:var(--mute);font-size:13px;letter-spacing:.5px}
#left{position:absolute;left:18px;top:18px;width:236px}
#left h3{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--gold)}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;margin-bottom:6px;font-size:14px;line-height:1.3;color:#8d96b3;background:#ffffff08;transition:all .35s}
.step b{flex:none;width:22px;height:22px;border-radius:50%;background:#3a4563;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.step.on{background:#f2c75c22;color:#fff;box-shadow:inset 0 0 0 1.5px var(--gold)}
.step.on b{background:var(--gold);color:#3a2a00}
.step.done{color:#bfc7df}
.step.done b{background:#4c8c6f}
#right{position:absolute;left:1036px;top:0;width:244px;height:660px}
.mem{position:absolute;left:14px;font-size:13px;color:var(--mute)}
.dots{display:flex;gap:7px;margin-top:5px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid #4d5a82;background:#ffffff0a;transition:all .4s}
.dot.f{background:var(--gold);border-color:#ffe9a8;box-shadow:0 0 12px #f2c75caa}
#cap{position:absolute;left:0;right:0;bottom:0;height:60px;background:#0b0f1dcc;border-top:1px solid #34406a;display:flex;align-items:center;padding:0 26px;font-size:21px;line-height:1.25}
#cap span{transition:opacity .25s}
.card{position:absolute;width:120px;height:168px;transform-origin:0 0}
.in{position:absolute;inset:0;border-radius:9px;background:#f5f1e6;border:3px solid #f5f1e6;box-shadow:0 5px 16px #0009;overflow:hidden}
.front{position:absolute;inset:0}
.art{position:absolute;left:0;right:0;top:0;bottom:34px;background-size:cover;background-position:center top}
.nm{position:absolute;left:0;right:0;bottom:15px;height:19px;background:#fff;color:#2a2f45;font:700 10px/19px "Segoe UI",sans-serif;text-align:center;white-space:nowrap;overflow:hidden}
.tag{position:absolute;left:4px;top:4px;background:#2b3250;color:#fff;font:700 8px/12px sans-serif;padding:0 5px;border-radius:6px;letter-spacing:.5px}
.hp{position:absolute;right:4px;top:4px;background:#fff;color:#c0392b;font:800 12px/16px sans-serif;padding:0 6px;border-radius:7px}
.bar{position:absolute;left:0;right:0;bottom:0;height:15px;background:#cfc9b8}
.bar i{display:block;height:100%;width:100%;background:#58c98a;transition:width .9s ease,background .5s}
.hearts{position:absolute;left:4px;bottom:38px;display:flex;gap:3px}
.h{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 3px #0008}
.bk{display:none;position:absolute;inset:0;background:repeating-linear-gradient(45deg,#2b3560 0 8px,#323d70 8px 16px);color:#cfd6ff;font:800 22px/168px sans-serif;text-align:center;letter-spacing:3px}
.card.back .front,.card.back .hearts,.card.back .rib{display:none}
.card.back .bk{display:block}
.prime .in{border-color:#16161c}
.prime .tag{background:#16161c;color:var(--gold)}
.limited .in{border-color:var(--gold);box-shadow:0 0 26px #f2c75c99,0 5px 16px #0009}
.rib{position:absolute;right:-30px;bottom:50px;width:120px;transform:rotate(-38deg);z-index:3;background:linear-gradient(90deg,#d6a529,#ffe08a,#d6a529);color:#4a3200;font:800 9px/14px sans-serif;text-align:center;letter-spacing:1px}
.pop{position:absolute;font-weight:800;text-shadow:0 2px 8px #000c;pointer-events:none;animation:up 1.5s ease-out forwards;white-space:nowrap}
@keyframes up{0%{transform:translateY(8px) scale(.6);opacity:0}15%{transform:translateY(0) scale(1.15);opacity:1}100%{transform:translateY(-54px) scale(1);opacity:0}}
.panel{position:absolute;left:736px;top:178px;width:282px;background:#10162bf2;border:1px solid #3b4772;border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.45;min-height:40px}
.panel div{opacity:0;transform:translateY(6px);transition:all .4s;margin-bottom:6px}
.panel div.on{opacity:1;transform:none}
.panel .r{color:var(--bad);font-weight:800}
.panel .g{color:var(--good);font-weight:800}
.panel .big{font-size:26px;color:#fff;font-weight:800}
#veil{position:absolute;left:250px;top:0;width:782px;height:660px;background:#0a0e1cef;opacity:0;pointer-events:none;transition:opacity .5s}
#veil.on{opacity:1}
#veil ul{position:absolute;left:330px;top:110px;width:420px;margin:0;padding:0;list-style:none;font-size:18px;line-height:1.35}
#veil li{margin-bottom:12px;opacity:0;transform:translateX(12px);transition:all .45s}
#veil li.on{opacity:1;transform:none}
#veil h2{position:absolute;left:330px;top:44px;margin:0;font-size:26px;color:var(--gold)}
#banner{position:absolute;left:250px;top:150px;width:782px;text-align:center;opacity:0;transform:scale(.8);transition:all .6s;pointer-events:none}
#banner.on{opacity:1;transform:none}
#banner h1{margin:0;font-size:78px;color:var(--gold);text-shadow:0 4px 30px #f2c75c88}
#banner p{margin:10px 0 0;font-size:22px;color:#fff}
#coin{position:absolute;left:760px;top:300px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#d8a62c);color:#4a3200;font:800 18px/90px sans-serif;text-align:center;box-shadow:0 6px 18px #000a;opacity:0}
#bar{flex:none;height:54px;background:#0b0f1d;border-top:1px solid #2a345a;display:flex;align-items:center;gap:6px;padding:0 10px;overflow-x:auto}
#bar button{font:inherit;font-size:14px;color:#fff;background:#262f4e;border:1px solid #3b4772;border-radius:9px;padding:5px 10px;cursor:pointer;white-space:nowrap}
#bar button:hover{background:#313c64}
#bar button.on{background:var(--gold);color:#3a2a00;border-color:var(--gold);font-weight:700}
#bar .sp{flex:1}
.sep{width:1px;height:26px;background:#2f3a62;margin:0 4px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stageBox"><div id="stage">
    <div id="left"><h3>Your turn</h3>
      <div class="step" id="s0"><b>1</b>Draw a card</div>
      <div class="step" id="s1"><b>2</b>Give 1 free Heart (once a turn)</div>
      <div class="step" id="s2"><b>3</b>Put Characters on the Bench</div>
      <div class="step" id="s3"><b>4</b>Evolve (Basic → Close → Bride)</div>
      <div class="step" id="s4"><b>5</b>Play 1 Supporter</div>
      <div class="step" id="s5"><b>6</b>Attack (ends your turn)</div>
    </div>
    <div id="dyn"></div>
    <div id="right">
      <div class="mem" style="top:20px">Memories · Rival<div class="dots" id="m1"></div></div>
      <div class="mem" style="top:78px">Memories · You<div class="dots" id="m0"></div></div>
      <div class="lbl" style="left:14px;top:158px">Your hand</div>
      <div class="lbl" style="left:14px;top:490px">Heart zone</div>
    </div>
    <div id="veil"><h2></h2><ul></ul></div>
    <div class="panel" id="panel" style="display:none"></div>
    <div id="banner"><h1>VICTORY!</h1><p></p></div>
    <div id="coin">HEADS</div>
    <div id="cap"><span id="capt"></span></div>
  </div></div>
  <div id="bar"></div>
</div>
<script src="battle-demo.js"></script>
</body>
</html>
